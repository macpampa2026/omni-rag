# Configuración no sensible.
apiVersion: v1
kind: ConfigMap
metadata:
  name: omni-rag-config
  namespace: omni-rag
data:
  OMNIRAG_EMBED_DIM: "768"
  # Ollama corre en el host; los pods lo alcanzan por host.docker.internal.
  OMNIRAG_OLLAMA_URL: "http://host.docker.internal:11434"
  OMNIRAG_REDIS_URL: "redis://redis:6379/0"
---
# Secretos (para el demo local; en producción irían en un gestor de secretos).
apiVersion: v1
kind: Secret
metadata:
  name: omni-rag-secrets
  namespace: omni-rag
type: Opaque
stringData:
  POSTGRES_USER: omni
  POSTGRES_PASSWORD: omni
  POSTGRES_DB: omni
  OMNIRAG_DATABASE_URL: "postgresql+psycopg://omni:omni@postgres:5432/omni"
