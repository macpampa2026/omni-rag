apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: omni-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: omni-rag-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: GATEWAY_API_URL
              value: "http://api:8000"
            - name: GATEWAY_PORT
              value: "9000"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: omni-rag
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30900
