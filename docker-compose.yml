# Stack completo de omni-rag para desarrollo local:
#   - db:    PostgreSQL con la extensión pgvector
#   - redis: cache de embeddings
#   - api:   el servicio FastAPI (corre migraciones y arranca)
#
# El motor de IA (Ollama) corre en el HOST; el api lo alcanza por
# host.docker.internal. Levantar todo con:  docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omni
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    environment:
      OMNIRAG_DATABASE_URL: postgresql+psycopg://omni:omni@db:5432/omni
      OMNIRAG_REDIS_URL: redis://redis:6379/0
      OMNIRAG_OLLAMA_URL: http://host.docker.internal:11434
      OMNIRAG_EMBED_DIM: "768"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Corre las migraciones y luego levanta la API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Microservicio en Go: agrega la salud del sistema (Go <-> Python).
  gateway:
    build: ./services/gateway
    environment:
      GATEWAY_API_URL: http://api:8000
      GATEWAY_PORT: "9000"
    ports:
      - "9000:9000"
    depends_on:
      - api

volumes:
  pgdata:
