[project]
name = "omni-rag-api"
version = "0.1.0"
description = "Plataforma de RAG para soporte y postventa retail (servicio API)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI usa llamadas en defaults (Depends(...)) a propósito

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
